<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c6a44">
<title>출하 전 셀프체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Hallmark · component-scope: 계산기형 단일 화면 · tone: utilitarian · 어르신 기준 큰 글자 · 아이콘 없음 */
:root{
  --paper:#ffffff;--ground:#f2f4f1;--ink:#16201a;--ink-2:#3f4b45;--mute:#4a5568;--line:#cfd6d0;--line-2:#e6ebe7;
  --accent:#1c6a44;--accent-ink:#14533a;--accent-bg:#e2f0e7;
  --red:#b0271b;--red-bg:#fdeceb;--amber-ink:#7a4d00;--amber-bg:#fbf1dc;--focus:#0b57d0;
  --fs-title:24px;--fs-big:34px;--fs-input:21px;--fs-body:18px;--fs-label:17px;--fs-small:16px;
  --h-ctl:60px;--r:12px;--r-s:8px;   /* 디자인 라이브러리 모서리 2단계: 컨트롤 8 · 카드 12 · 알약 */
  --sp-1:6px;--sp-2:10px;--sp-3:14px;--sp-4:18px;--sp-5:24px;--sp-6:32px;
  --ease-out:cubic-bezier(.23,1,.32,1);--dur:120ms;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
  background:var(--ground);color:var(--ink);font-size:var(--fs-body);line-height:1.6;word-break:keep-all;
  max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* 헤더·하단 글자는 카드 안 글자와 같은 세로선(바깥 18px + 카드 안 18px = 36px)에 맞춘다 */
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:var(--sp-4) calc(var(--sp-4)*2) var(--sp-3)}
.top h1{font-size:var(--fs-title);font-weight:800;letter-spacing:-.02em;line-height:1.3}
.top p{font-size:var(--fs-small);color:var(--mute);margin-top:2px}
main{flex:1;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--sp-4)}
h2{font-size:var(--fs-label);font-weight:700;color:var(--ink-2);margin-bottom:var(--sp-2)}
.fld{margin-bottom:var(--sp-4);position:relative}
.fld:last-of-type{margin-bottom:0}
label{display:block;font-size:var(--fs-label);font-weight:700;color:var(--ink-2);margin-bottom:var(--sp-1)}
.hint{font-size:var(--fs-small);color:var(--mute);margin-top:var(--sp-1)}
input[type=text],input[type=number]{width:100%;height:var(--h-ctl);border:2px solid var(--line);border-radius:var(--r-s);padding:0 var(--sp-3);
  font:inherit;font-size:var(--fs-input);color:var(--ink);background:var(--paper);outline:none;appearance:none;-webkit-appearance:none;min-width:0}
input::placeholder{color:var(--mute);opacity:1}
input:focus-visible{border-color:var(--focus);box-shadow:0 0 0 3px rgba(11,87,208,.25)}
/* 날짜 선택 — 브라우저 기본 달력은 글자를 못 키워서 자체 달력(큰 칸) */
.dbtn{display:flex;align-items:center;justify-content:space-between;width:100%;height:var(--h-ctl);border:2px solid var(--line);border-radius:var(--r-s);padding:0 var(--sp-3);
  background:var(--paper);font:inherit;font-size:var(--fs-input);color:var(--ink);text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.dbtn::after{content:"바꾸기";font-size:var(--fs-small);font-weight:700;color:var(--accent-ink)}
.dbtn[aria-expanded=true]{border-color:var(--ink-2)}
.dbtn[aria-expanded=true]::after{content:"닫기"}
.dbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cal{margin-top:var(--sp-2);border:2px solid var(--ink-2);border-radius:var(--r);background:var(--paper);padding:var(--sp-3)}
.cal[hidden]{display:none}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)}
.cal .ch b{font-size:var(--fs-input);font-weight:800;font-variant-numeric:tabular-nums}
.cal .ch button{width:56px;height:52px;border:2px solid var(--line);border-radius:var(--r-s);background:var(--paper);font:inherit;font-size:26px;font-weight:700;color:var(--ink-2);cursor:pointer;line-height:1}
.cal .ch button:active{background:var(--line-2)}
.cal .ch button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:var(--fs-small);font-weight:700;color:var(--ink-2);padding:4px 0 6px}
.cal .w.su,.cal .d.su{color:var(--red)}
.cal .d{height:52px;border:0;border-radius:var(--r-s);background:transparent;font:inherit;font-size:var(--fs-input);font-weight:700;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.cal .d.x{color:var(--line);cursor:default}
.cal .d.tod{box-shadow:inset 0 0 0 2px var(--ink-2)}
.cal .d.on{background:var(--accent);color:var(--paper)}
.cal .d.on.su{color:var(--paper)}
.cal .d:not(.x):not(.on):active{background:var(--accent-bg)}
.cal .d:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.cal .cf{display:flex;justify-content:space-between;margin-top:var(--sp-2)}
.cal .cf button{height:48px;padding:0 var(--sp-4);border:2px solid var(--line);border-radius:24px;background:var(--paper);font:inherit;font-size:var(--fs-small);font-weight:700;color:var(--ink-2);cursor:pointer}
.cal .cf button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* 자동완성 목록 */
.ac{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--paper);border:2px solid var(--ink-2);border-radius:var(--r-s);
  margin-top:4px;max-height:312px;overflow-y:auto;box-shadow:0 8px 24px rgba(22,32,26,.16)}
.ac[hidden]{display:none}
.ac button{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:56px;padding:var(--sp-2) var(--sp-3);
  border:0;border-bottom:1px solid var(--line-2);background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.ac button:last-child{border-bottom:0}
.ac button:hover,.ac button:focus-visible{background:var(--accent-bg);outline:none}
.ac button:active{background:var(--line-2)}
.ac b{font-weight:700;font-size:var(--fs-body)}
.ac small{font-size:var(--fs-small);color:var(--mute);line-height:1.4}
.ac .no{color:var(--mute);cursor:default}
.chips{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap}
.chip{height:44px;padding:0 var(--sp-3);border:2px solid var(--line);border-radius:22px;background:var(--paper);font:inherit;font-size:var(--fs-small);
  font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip:active,.chip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.step{display:flex;height:var(--h-ctl);border:2px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.step button{width:56px;flex:none;border:0;background:var(--paper);font:inherit;font-size:28px;font-weight:700;color:var(--ink-2);cursor:pointer;line-height:1}
.step button:active{background:var(--line-2)}
.step button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.step output{flex:1;display:flex;align-items:center;justify-content:center;font-size:var(--fs-input);font-weight:700;border-left:2px solid var(--line);border-right:2px solid var(--line);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:var(--h-ctl);margin-top:var(--sp-5);border:0;border-radius:var(--r-s);
  background:var(--accent);color:var(--paper);font:inherit;font-size:var(--fs-input);font-weight:800;cursor:pointer;transition:transform var(--dur) var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* 결과 */
.res{border-radius:var(--r);padding:var(--sp-4);border:2px solid transparent}
.res.ok{background:var(--accent-bg);border-color:var(--accent)}
.res.bad{background:var(--red-bg);border-color:var(--red)}
.res.warn{background:var(--amber-bg);border-color:var(--amber-ink)}
.res .k{font-size:var(--fs-label);font-weight:700}
.res.ok .k{color:var(--accent-ink)}.res.bad .k{color:var(--red)}.res.warn .k{color:var(--amber-ink)}
.res .big{font-size:var(--fs-big);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:var(--sp-1) 0 var(--sp-2);font-variant-numeric:tabular-nums}
.res p{font-size:var(--fs-body);color:var(--ink)}
.res .msg{font-size:var(--fs-body);color:var(--ink-2);margin-top:var(--sp-3)}
/* 결과 항목 — 번호 · 항목명 · 값 한 줄씩 */
.kv{list-style:none;counter-reset:kv;display:flex;flex-direction:column;gap:var(--sp-2)}
.kv li{counter-increment:kv;display:grid;grid-template-columns:1.4em auto 1fr;gap:0 var(--sp-2);align-items:baseline;font-size:var(--fs-body);line-height:1.5}
.kv li::before{content:counter(kv) ".";font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kv .kl{font-weight:700;color:var(--ink-2);white-space:nowrap}
.kv .kl::after{content:":"}
.kv .kx{font-weight:700;color:var(--ink)}
.kv .kx small{display:block;font-size:var(--fs-small);font-weight:400;color:var(--ink-2)}
.kv .ng{color:var(--red)}
.kv li.full .kx{grid-column:2/4;margin-top:2px}   /* 긴 목록 값은 항목명 아래 줄로 */
.note{margin-top:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-s);background:var(--paper);border:1px solid var(--line);font-size:var(--fs-small);color:var(--ink-2)}
.note b{color:var(--ink)}
details.card summary{font-size:var(--fs-label);font-weight:700;color:var(--ink-2);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"열기";font-size:var(--fs-small);font-weight:700;color:var(--accent-ink)}
details.card[open] summary::after{content:"닫기"}
details.card summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
details.card .body{margin-top:var(--sp-3)}
.foot{padding:var(--sp-4) calc(var(--sp-4)*2);font-size:var(--fs-small);color:var(--mute);line-height:1.55;border-top:1px solid var(--line)}
.foot-h{font-size:var(--fs-body);color:var(--ink-2);margin-bottom:var(--sp-3)}
.foot-h b{display:block;color:var(--ink);font-size:var(--fs-label)}
.src{display:block}   /* 항목명 한 줄 · 출처 한 줄 · 기준일 한 줄 (좁은 폭에서 외톨이 줄 방지) */
.src dt{font-weight:700;color:var(--ink-2);margin-top:var(--sp-2)}
.src dd{margin:0}
.src small{display:block;font-size:var(--fs-small);color:var(--mute)}
.empty{color:var(--mute);font-size:var(--fs-body)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-contrast:more){:root{--line:#8a948e;--mute:#3f4b45}}
@media (min-width:600px){body{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<header class="top">
  <h1>출하 전 셀프체크</h1>
  <p>파주시 농산물 안전분석실</p>
</header>
<main>
  <section class="card" aria-labelledby="f-title">
    <h2 id="f-title">뿌린 농약을 알려 주세요</h2>
    <div class="fld">
      <label for="crop">작물</label>
      <input type="text" id="crop" placeholder="예) 상추" autocomplete="off" inputmode="text" enterkeyhint="next">
      <div class="ac" id="crop-ac" hidden role="listbox"></div>
    </div>
    <div class="fld">
      <label for="pest">농약 (상표명 또는 성분)</label>
      <input type="text" id="pest" placeholder="예) 모스피란" autocomplete="off" inputmode="text" enterkeyhint="next">
      <div class="ac" id="pest-ac" hidden role="listbox"></div>
      <p class="hint" id="pest-hint">농약 통에 적힌 이름 그대로 적으세요</p>
    </div>
    <div class="fld">
      <label for="date">마지막 살포일</label>
      <input type="hidden" id="date">
      <button type="button" class="dbtn" id="date-btn" aria-haspopup="true" aria-expanded="false" aria-controls="date-cal"></button>
      <div class="cal" id="date-cal" hidden></div>
      <div class="chips" aria-label="살포일 빠른 선택">
        <button type="button" class="chip" data-d="0">오늘</button>
        <button type="button" class="chip" data-d="1">1일 전</button>
        <button type="button" class="chip" data-d="2">2일 전</button>
        <button type="button" class="chip" data-d="7">7일 전</button>
        <button type="button" class="chip" data-d="14">14일 전</button>
      </div>
    </div>
    <div class="fld">
      <label id="cnt-l">몇 번째 살포</label>
      <div class="step" role="group" aria-labelledby="cnt-l">
        <button type="button" id="cnt-m" aria-label="하나 줄이기">−</button>
        <output id="cnt" aria-live="off">1회째</output>
        <button type="button" id="cnt-p" aria-label="하나 늘리기">+</button>
      </div>
    </div>
    <button type="button" class="btn" id="go">확인하기</button>
  </section>

  <section id="result" aria-live="polite"></section>

  <details class="card" id="det">
    <summary>검사에서 검출값이 나왔다면</summary>
    <div class="body">
      <p class="hint" style="margin:0 0 var(--sp-3)">분석실 결과지의 검출값과 검사 접수일을 넣으면 출하할 수 있는 날을 참고로 계산합니다. 위의 작물·농약을 그대로 씁니다.</p>
      <div class="fld">
        <label for="val">검출값 (mg/kg)</label>
        <input type="number" id="val" inputmode="decimal" step="0.001" min="0" placeholder="예) 0.35">
      </div>
      <div class="fld">
        <label for="rdate">검사 접수일</label>
        <input type="hidden" id="rdate">
        <button type="button" class="dbtn" id="rdate-btn" aria-haspopup="true" aria-expanded="false" aria-controls="rdate-cal"></button>
        <div class="cal" id="rdate-cal" hidden></div>
      </div>
      <button type="button" class="btn" id="go2">출하 가능일 계산</button>
      <div id="result2" style="margin-top:var(--sp-3)" aria-live="polite"></div>
    </div>
  </details>
</main>
<footer class="foot">
  <p class="foot-h"><b>참고용 안내입니다.</b><br>법적 판정은 검사 성적서 기준입니다.</p>
  <dl class="src">
    <dt>농약 등록정보</dt><dd>농촌진흥청 농약안전정보시스템<small id="m-psis"></small></dd>
    <dt>잔류허용기준</dt><dd>식품의약품안전처 식품공전<small id="m-mrl"></small></dd>

<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('D').textContent);
var $=function(id){return document.getElementById(id);};
var sel={crop:-1,prod:-1,brand:-1};
var cnt=1;
var DAY=['일','월','화','수','목','금','토'];

// ── 메타
$('m-psis').textContent=fmtYmd(D.meta.psis_date)+' 기준';
$('m-mrl').textContent=(D.meta.mrl_no?'고시 '+D.meta.mrl_no.replace(/^제?(\d{4}-\d+)호?$/,'제$1호'):'')+(D.meta.mrl_updated?' · '+D.meta.mrl_updated+' 반영':'');
function fmtYmd(s){return s.slice(0,4)+'.'+s.slice(4,6)+'.'+s.slice(6,8);}

// ── 인덱스
var cropLower=D.crops.map(function(c){return c.toLowerCase();});
var pestIdx=[];   // {t:검색어(소문자), b:상표idx|-1, p:품목idx, kind}
D.brands.forEach(function(b,bi){pestIdx.push({t:b.toLowerCase(),b:bi,p:-1});});
D.prods.forEach(function(p,pi){pestIdx.push({t:p[0].toLowerCase(),b:-1,p:pi});pestIdx.push({t:p[1].toLowerCase(),b:-1,p:pi,en:true});});
var brandProds={};  // 상표idx → [품목idx]
D.pb.forEach(function(list,pi){list.forEach(function(bi){(brandProds[bi]=brandProds[bi]||[]).push(pi);});});

// ── 날짜 기본값: 오늘
var today=new Date();today.setHours(0,0,0,0);
$('date').value=iso(today);$('rdate').value=iso(today);
// ── 자체 달력 (칸 52px · 숫자 21px, 오늘 이후는 고를 수 없음)
function makeCal(hid,btn,box){
  var view=new Date(today.getFullYear(),today.getMonth(),1);
  function label(){var d=parseD(hid.value)||today;btn.textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일('+DAY[d.getDay()]+')';}
  function set(d){hid.value=iso(d);hid.dispatchEvent(new Event('input',{bubbles:true}));label();}
  function draw(){
    var y=view.getFullYear(),m=view.getMonth();var sel=parseD(hid.value);
    var h='<div class="ch"><button type="button" data-n="-1" aria-label="이전 달">◀</button><b>'+y+'년 '+(m+1)+'월</b><button type="button" data-n="1" aria-label="다음 달">▶</button></div><div class="g">';
    DAY.forEach(function(w,i){h+='<div class="w'+(i===0?' su':'')+'">'+w+'</div>';});
    var first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
    for(var i=0;i<first;i++)h+='<div></div>';
    for(var d=1;d<=last;d++){var dt=new Date(y,m,d);var fut=dt>today;var cls='d'+(dt.getDay()===0?' su':'')+(fut?' x':'')+(iso(dt)===iso(today)?' tod':'')+(sel&&iso(dt)===iso(sel)?' on':'');
      h+='<button type="button" class="'+cls+'" data-d="'+iso(dt)+'"'+(fut?' disabled aria-disabled="true"':'')+(sel&&iso(dt)===iso(sel)?' aria-pressed="true"':'')+'>'+d+'</button>';}
    h+='</div><div class="cf"><button type="button" data-t="1">오늘로</button><button type="button" data-c="1">닫기</button></div>';
    box.innerHTML=h;
  }
  function open(o){box.hidden=!o;btn.setAttribute('aria-expanded',o?'true':'false');if(o){var d=parseD(hid.value)||today;view=new Date(d.getFullYear(),d.getMonth(),1);draw();}}
  btn.addEventListener('click',function(){open(box.hidden);});
  box.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
    if(t.dataset.n){view.setMonth(view.getMonth()+(+t.dataset.n));draw();}
    else if(t.dataset.d){set(parseD(t.dataset.d));open(false);}
    else if(t.dataset.t){set(today);open(false);}
    else if(t.dataset.c){open(false);}});
  hid.addEventListener('input',label);
  label();
  return {set:set};
}
makeCal($('date'),$('date-btn'),$('date-cal'));makeCal($('rdate'),$('rdate-btn'),$('rdate-cal'));
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return (n<10?'0':'')+n;}
function parseD(v){if(!v)return null;var m=v.match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function ko(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일('+DAY[d.getDay()]+')';}
function koY(d){return d.getFullYear()!==today.getFullYear()?d.getFullYear()+'년 '+ko(d):ko(d);}

// ── 자동완성 공통
function bindAc(inp,box,search,render,pick){
  var items=[];
  inp.addEventListener('input',function(){
    var q=inp.value.trim().toLowerCase();
    items=q?search(q):[];
    if(!q){box.hidden=true;return;}
    box.innerHTML='';
    if(!items.length){box.innerHTML='<button type="button" class="no" tabindex="-1">찾는 이름이 없어요. 다른 이름으로 적어 보세요</button>';box.hidden=false;return;}
    items.forEach(function(it){var b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.innerHTML=render(it);
      b.addEventListener('mousedown',function(e){e.preventDefault();});
      b.addEventListener('click',function(){pick(it);box.hidden=true;});box.appendChild(b);});
    box.hidden=false;
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&items.length){e.preventDefault();pick(items[0]);box.hidden=true;}
    if(e.key==='Escape')box.hidden=true;});
  inp.addEventListener('blur',function(){setTimeout(function(){box.hidden=true;},150);});
}
function rank(list,q,key){
  var a=[],b=[];
  for(var i=0;i<list.length;i++){var t=key(list[i]);var k=t.indexOf(q);if(k===0)a.push(list[i]);else if(k>0)b.push(list[i]);}
  return a.concat(b);
}
bindAc($('crop'),$('crop-ac'),function(q){
  var hits=[];for(var i=0;i<cropLower.length;i++)if(cropLower[i].indexOf(q)>=0)hits.push(i);
  hits.sort(function(x,y){var sx=cropLower[x].indexOf(q)===0?0:1,sy=cropLower[y].indexOf(q)===0?0:1;if(sx!==sy)return sx-sy;
    return D.crops[x].length-D.crops[y].length||D.crops[x].localeCompare(D.crops[y]);});
  return hits.slice(0,8);
},function(i){return '<b>'+esc(D.crops[i])+'</b>';},function(i){sel.crop=i;$('crop').value=D.crops[i];});

bindAc($('pest'),$('pest-ac'),function(q){
  var hits=rank(pestIdx.filter(function(x){return x.t.indexOf(q)>=0;}),q,function(x){return x.t;});
  var seen={},out=[];
  hits.forEach(function(x){var key=x.b>=0?'b'+x.b:'p'+x.p;if(seen[key])return;seen[key]=1;out.push(x);});
  return out.slice(0,8);
},function(x){
  if(x.b>=0){var ps=brandProds[x.b]||[];return '<b>'+esc(D.brands[x.b])+'</b><small>'+esc(ps.map(function(pi){return D.prods[pi][0];}).join(' · '))+'</small>';}
  return '<b>'+esc(D.prods[x.p][0])+'</b><small>'+esc(D.prods[x.p][1])+' · '+esc(D.prods[x.p][2])+'</small>';
},function(x){
  if(x.b>=0){sel.brand=x.b;sel.prod=-1;$('pest').value=D.brands[x.b];}
  else{sel.brand=-1;sel.prod=x.p;$('pest').value=D.prods[x.p][0];}
});
$('crop').addEventListener('input',function(){sel.crop=-1;});
$('pest').addEventListener('input',function(){sel.brand=-1;sel.prod=-1;});

// ── 살포일 칩 · 횟수
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){c.addEventListener('click',function(){
  $('date').value=iso(addDays(today,-(+c.dataset.d)));$('date').dispatchEvent(new Event('input',{bubbles:true}));
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(o){o.setAttribute('aria-pressed',o===c?'true':'false');});
});});
$('date-cal').addEventListener('click',function(e){if(e.target.closest('button[data-d],button[data-t]'))Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(o){o.setAttribute('aria-pressed','false');});});
function setCnt(n){cnt=Math.max(1,Math.min(9,n));$('cnt').textContent=cnt+'회째';}
$('cnt-m').addEventListener('click',function(){setCnt(cnt-1);});
$('cnt-p').addEventListener('click',function(){setCnt(cnt+1);});

// ── 판정
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(s){var m=/수확\s*(\d+)\s*일\s*전/.exec(s);return m?+m[1]:null;}
function fnum(s){var m=/(\d+)\s*회/.exec(s);return m?+m[1]:null;}
function ens(pi){return D.prods[pi][1].toLowerCase().split('+').map(function(s){return s.trim();}).filter(Boolean);}
function mrlOf(en,ci){var key=D.cropMrl[ci];var m=D.mrl[en];if(m&&key&&m[key]!=null)return {v:m[key],pls:false};return {v:0.01,pls:true};}
function fmtV(v){return (v<0.1?v.toFixed(3):v.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'.0');}
function resolveCrop(){
  if(sel.crop>=0)return sel.crop;
  var v=$('crop').value.trim();if(!v)return -1;
  var i=D.crops.indexOf(v);if(i>=0){sel.crop=i;return i;}
  var q=v.toLowerCase();for(var j=0;j<cropLower.length;j++)if(cropLower[j]===q||cropLower[j].indexOf(q+'(')===0){sel.crop=j;return j;}
  return -1;
}
function resolvePest(){
  if(sel.brand>=0||sel.prod>=0)return true;
  var v=$('pest').value.trim().toLowerCase();if(!v)return false;
  var bi=D.brands.map(function(b){return b.toLowerCase();}).indexOf(v);if(bi>=0){sel.brand=bi;return true;}
  for(var pi=0;pi<D.prods.length;pi++)if(D.prods[pi][0].toLowerCase()===v||D.prods[pi][1].toLowerCase()===v){sel.prod=pi;return true;}
  return false;
}
function candProds(){return sel.brand>=0?(brandProds[sel.brand]||[]):[sel.prod];}
function pestName(){return sel.brand>=0?D.brands[sel.brand]:D.prods[sel.prod][0];}

$('go').addEventListener('click',run);
function run(){
  var out=$('result');
  var ci=resolveCrop();
  if(ci<0){out.innerHTML='<div class="res warn"><div class="k">작물을 골라 주세요</div><p class="msg">작물 칸에 이름을 적고 목록에서 눌러 고르세요.</p></div>';$('crop').focus();return;}
  if(!resolvePest()){out.innerHTML='<div class="res warn"><div class="k">농약을 골라 주세요</div><p class="msg">농약 칸에 상표명이나 성분명을 적고 목록에서 눌러 고르세요.</p></div>';$('pest').focus();return;}
  var spray=parseD($('date').value)||today;
  var reg=(D.cp[ci]||{});
  var ps=candProds().filter(function(pi){return reg[pi];});
  var crop=D.crops[ci],name=pestName();
  if(!ps.length){renderBad(out,ci,crop,name);return;}
  var pi=ps[0];
  var combos=reg[pi].map(function(c){return {phi:D.phis[c[0]],freq:D.freqs[c[1]]};});
  var days=combos.map(function(c){return num(c.phi);}).filter(function(n){return n!=null;});
  var texts=combos.map(function(c){return c.phi;}).filter(function(t){return num(t)==null&&t&&t!=='-';});
  var maxF=combos.map(function(c){return fnum(c.freq);}).filter(function(n){return n!=null;});
  var fmax=maxF.length?Math.min.apply(null,maxF):null;
  var html='',cls='ok',rows=[];
  var over=fmax!=null&&cnt>fmax;
  html+='<div class="k">'+esc(crop)+'에 등록된 농약입니다</div>';
  if(days.length){
    var n=Math.max.apply(null,days);var d=addDays(spray,n);
    html+='<div class="big">'+koY(d)+'부터 수확</div>';
    var multi=days.length>1&&Math.min.apply(null,days)!==n;
    rows.push(['수확',n+'일 전까지'+(multi?' <small>(병해충에 따라 '+uniq(days).sort(function(a,b){return a-b;}).join('·')+'일 — 긴 쪽)</small>':'')]);
  }else{
    html+='<div class="big">'+esc(texts[0]||'사용 시기 확인')+'</div>';
    rows.push(['사용 시기',esc(texts.join(', ')||'등록된 시기')+' <small>(수확 전 일수 기준 없음)</small>']);
  }
  rows.push(['최대',fmax!=null?fmax+'회 사용 가능':'횟수 기준 없음']);
  if(over){cls='warn';rows.push(['이번 살포','<span class="ng">'+cnt+'회째 — 횟수 초과, 뿌리지 마세요</span>']);}
  else rows.push(['이번 살포',cnt+'회째'+(fmax!=null&&cnt===fmax?' — 마지막 살포':'')]);
  rows.push(['잔류허용기준',mrlText(pi,ci)]);
  if(sel.brand>=0&&candProds().length>1)rows.push(['기준 품목',esc(D.prods[pi][0])]);
  html+=kv(rows);
  if(over)html+='<p class="msg">이미 뿌렸다면 분석실에 문의해 주세요.</p>';
  out.innerHTML='<div class="res '+cls+'">'+html+'</div>';
}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i;});}
function kv(rows){return '<ol class="kv">'+rows.map(function(r){return '<li'+(r[2]?' class="full"':'')+'><span class="kl">'+r[0]+'</span><span class="kx">'+r[1]+'</span></li>';}).join('')+'</ol>';}
function kos(pi){  // 품목명에서 제형을 뗀 한글 성분명 (혼합제는 성분별)
  var n=D.prods[pi][0].replace(/\s+\S+$/,'');return n.split(/[.·]/).map(function(s){return s.trim();}).filter(Boolean);
}
function mrlText(pi,ci){
  var en=ens(pi),ko=kos(pi);
  return en.map(function(e,i){var m=mrlOf(e,ci);return fmtV(m.v)+' mg/kg <small>('+esc(ko[i]||e)+(m.pls?' · 등록 안 된 작물 기준':'')+')</small>';}).join('<br>');
}
function renderBad(out,ci,crop,name){
  var html='<div class="k">'+esc(crop)+'에 쓸 수 없는 농약입니다</div><div class="big">'+esc(name)+'</div>';
  var pis=candProds();var en=ens(pis[0]);var rows=[];
  rows.push(['등록','<span class="ng">'+esc(crop)+'에 미등록 — 사용 금지</span>']);
  rows.push(['잔류허용기준',mrlText(pis[0],ci)]);
  var okc=[];for(var c in D.cp){if(pis.some(function(pi){return D.cp[c][pi];}))okc.push(D.crops[c]);}
  if(okc.length)rows.push(['등록된 작물',esc(okc.slice(0,8).join(', '))+(okc.length>8?' 외 '+(okc.length-8)+'개':''),true]);
  html+=kv(rows);
  html+='<p class="msg">등록되지 않은 농약은 기준이 아주 낮아 조금만 남아도 부적합이 됩니다.</p>';
  out.innerHTML='<div class="res bad">'+html+'</div>';
}

// ── 검출값 → 출하가능일 (생산단계 감소상수, 별표2 가~마목 순)
$('go2').addEventListener('click',function(){
  var out=$('result2');
  var ci=resolveCrop();
  if(ci<0||!resolvePest()){out.innerHTML='<div class="res warn"><div class="k">위에서 작물과 농약을 먼저 골라 주세요</div></div>';return;}
  var v=parseFloat($('val').value);
  if(!(v>0)){out.innerHTML='<div class="res warn"><div class="k">검출값을 적어 주세요</div><p class="msg">결과지에 적힌 숫자를 그대로 넣으세요 (예 0.35).</p></div>';$('val').focus();return;}
  var rd=parseD($('rdate').value)||today;
  var pi0=candProds()[0];var en=ens(pi0)[0];var koN=kos(pi0)[0]||en;
  var m=mrlOf(en,ci);
  if(v<=m.v){out.innerHTML='<div class="res ok"><div class="k">기준 이내입니다</div><div class="big">바로 출하 가능</div>'+kv([['검출값',fmtV(v)+' mg/kg <small>('+esc(koN)+')</small>'],['잔류허용기준',fmtV(m.v)+' mg/kg']])+'</div>';return;}
  var pk=D.cropPs[ci];var k=null,how='';
  if(pk){var pc=D.ps.crops[pk];
    if(pc.k[en]!=null){k=pc.k[en];how='품목·성분 값';}
    else{var vals=Object.keys(pc.k).map(function(e){return pc.k[e];});if(vals.length){k=Math.min.apply(null,vals);how='품목 최저값(추정)';}}
    if(k==null){var s=D.ps.kmin.sub[pc.sub+'\t'+en];if(s!=null){k=s;how='소분류 최저값(추정)';}}
    if(k==null){var g=D.ps.kmin.major[pc.major+'\t'+en];if(g!=null){k=g;how='대분류 최저값(추정)';}}
  }
  if(k==null){var a=D.ps.kmin.all[en];if(a!=null){k=a;how='전체 최저값(추정)';}}
  if(k==null){out.innerHTML='<div class="res warn"><div class="k">계산할 수 없는 조합입니다</div><p class="msg">이 작물·농약은 생산단계 감소상수 자료에 없어요. 분석실에 문의해 주세요.</p></div>';return;}
  var delay=Math.log(v/m.v)/k;var days=Math.floor(delay)+1;var d=addDays(rd,days);
  out.innerHTML='<div class="res warn"><div class="k">참고 출하 가능일</div><div class="big">'+koY(d)+'부터</div>'+kv([['검출값',fmtV(v)+' mg/kg <small>('+esc(koN)+')</small>'],['잔류허용기준',fmtV(m.v)+' mg/kg'],['줄어드는 날수','약 '+days+'일 <small>(접수일 '+ko(rd)+' 기준)</small>'],['감소상수',k+' <small>('+how+')</small>']])+'<p class="msg">정식 안내는 분석실 통보를 따르세요.</p></div>';
});
})();
</script>
